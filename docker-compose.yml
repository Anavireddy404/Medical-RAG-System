version: '3.8'

services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-rag-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://medicaluser:medicalpassword@db:5432/medical_rag
      - REDIS_URL=redis://cache:6379/0
      - ENVIRONMENT=production
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    networks:
      - medical-rag-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: medical-rag-db
    environment:
      POSTGRES_USER: medicaluser
      POSTGRES_PASSWORD: medicalpassword
      POSTGRES_DB: medical_rag
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - medical-rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicaluser -d medical_rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  cache:
    image: redis:7-alpine
    container_name: medical-rag-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medical-rag-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-medicalpassword}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Nginx Frontend & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: medical-rag-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - medical-rag-network
    restart: unless-stopped

  # PgAdmin for Database Management (Development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medical-rag-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medicalrag.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - medical-rag-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  medical-rag-network:
    driver: bridge
